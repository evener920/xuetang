# Cloudflare Worker 部署配置（云端同步 + 托管 site/ 静态站）
# 部署前请把 account_id 和 kv_namespaces.id 改成你自己的值。

name = "xuetang"
main = "worker.js"
compatibility_date = "2024-09-23"

# 你的 Cloudflare 账户 ID（控制台右下角 / 或 `wrangler whoami` 可见）
account_id = "YOUR_ACCOUNT_ID"

# 用 Workers Static Assets 直接托管 site/ 目录（无需单独构建）
assets = { directory = "site", binding = "ASSETS" }

# 云端同步用的 KV：先 `wrangler kv namespace create xuetang-sync`，把返回的 id 填到下面
kv_namespaces = [
  { binding = "SYNC_KV", id = "YOUR_KV_NAMESPACE_ID" }
]
