# Cloudflare Worker 部署配置（云端同步 + 托管 site/ 静态站）
# 本文件位于 worker/ 目录，故 assets.directory 用 "../site" 指向仓库根的 site/

name = "xuetang"
main = "worker.js"
compatibility_date = "2025-04-01"

# 你的 Cloudflare 账户 ID（已填好）
account_id = "82129ffe005dfd5010505adf73de06cb"

# 用 Workers Static Assets 直接托管 site/ 目录（无需单独构建）
assets = { directory = "../site", binding = "ASSETS" }

# 云端同步用的 KV（已建好 xuetang-sync）：变量名必须叫 SYNC_KV
kv_namespaces = [
  { binding = "SYNC_KV", id = "a52c5b9f80b0477eb6923ab17ad58f57" }
]
