<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学堂 · 中小学学科学习</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=20261024bs" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📚</span>
      <div>
        <div class="brand-name">学堂</div>
        <div class="brand-sub">诗词 · 成语 · 单词 · 每日进阶</div>
      </div>
    </div>
    <nav class="nav" id="mainNav">
      <button class="nav-btn active" data-view="home">首页</button>
      <button class="nav-btn" data-view="week" title="复习 · 看板 · 周计划">本周</button>
      <button class="nav-btn" data-view="reward" title="打卡积分 · 奖励商城">奖励</button>
      <button class="nav-btn" data-view="语文">语文</button>
      <button class="nav-btn" data-view="数学">数学</button>
      <button class="nav-btn" data-view="英语">英语</button>
      <button class="nav-btn" data-view="科学" title="可在后台添加素材">科学</button>
      <button class="nav-btn" data-view="人文" title="人文类 · 可在后台添加素材">人文</button>
      <button class="nav-btn" data-view="res" title="站内全部内置内容 · 可查看与修改">资源</button>
      <button class="nav-btn admin-btn" data-view="admin" title="内容管理后台">后台</button>
    </nav>
    <div class="topbar-right">
      <div class="student-switch">
        <button class="chip" id="studentBtn">🙋 学生</button>
        <div class="student-menu" id="studentMenu" hidden></div>
      </div>
      <input id="globalSearch" class="search-input" type="search" placeholder="搜索诗词 / 单词 / 成语…" />
      <select id="gradeSelect" class="grade-select" title="学习年级（全局语境）"></select>
    </div>
  </header>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-week" class="view" hidden></section>
    <section id="view-reward" class="view" hidden></section>
    <section id="view-res" class="view" hidden></section>
    <section id="view-subject" class="view" hidden></section>
    <section id="view-tag" class="view" hidden></section>
    <section id="view-search" class="view" hidden></section>
    <section id="view-admin" class="view" hidden></section>
  </main>

  <footer class="foot">
    内容来源：本地数据 · 诗词 314 首 / 成语 270 个 / 单词 1293 个 / 成语动画 180 集 / 科学动画 62 集 · 数学·科学·人文等教材已内置，更多年级素材可在「🛠 后台」或「📚 资源」导入
  </footer>

  <!-- 详情弹窗 -->
  <div id="modal" class="modal" hidden>
    <div class="modal-mask" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close>×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js?v=20261024bs"></script>
  <script src="extra.js?v=20261024bs"></script>
  <script src="extra2.js?v=20261024bs"></script>
  <script src="history_guide_7.js?v=20261024bs"></script>
  <script src="english_reading_4.js?v=20261024bs"></script>
  <script src="english_listening_4.js?v=20261024bs"></script>
  <script src="gallery.js?v=20261024bs"></script>
  <script src="science_gallery.js?v=20261024bs"></script>
  <script src="app.js?v=20261024bs"></script>
</body>
</html>
